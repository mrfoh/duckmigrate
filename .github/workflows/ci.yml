name: ci

on:
  push:
    branches:
      - main
    tags: 
      - 'v*'
  pull_request:

env:
  GO_VERSION: "1.26.2"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
  release:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # DuckDB requires CGO; goreleaser-cross bundles the osxcross / mingw /
      # linux cross toolchains needed to link every target from one runner.
      - name: Run GoReleaser
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -v "$PWD":/go/src/github.com/mrfoh/duckmigrate \
            -w /go/src/github.com/mrfoh/duckmigrate \
            ghcr.io/goreleaser/goreleaser-cross:v${{ env.GO_VERSION }} \
            release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
