version: 2
project_name: duckmigrate

# DuckDB is a CGO dependency whose prebuilt Windows static libs target the UCRT,
# which goreleaser-cross's MSVCRT mingw can't link. Each binary is instead built
# natively on its own runner (see .github/workflows/ci.yml); the gobinary shim
# feeds those prebuilt binaries to GoReleaser (the OSS prebuilt builder is Pro-only).
builds:
- id: duckmigrate
  main: ./cmd/duckmigrate
  binary: duckmigrate
  gobinary: ./scripts/prebuilt-go.sh
  goos:
  - linux
  - darwin
  - windows
  goarch:
  - amd64
  - arm64
  ignore:
  - goos: windows
    goarch: arm64

archives:
- id: default
  name_template: "{{ .ProjectName }}-v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  formats: [tar.gz]
  files:
  - LICENSE*
  - README*
  format_overrides:
  - goos: windows
    formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - '^ci:'
    - '^chore:'
    - Merge pull request
    - Merge branch

# Scoop bucket integration
scoops:
- name: duckmigrate
  description: "Database migrations for DuckDB, as a Go library and a Cobra CLI."
  homepage: "https://github.com/mrfoh/duckmigrate"
  license: "MIT"
  repository:
    owner: mrfoh
    name: scoopbucket
    branch: main
    token: "{{ .Env.GITHUB_TOKEN }}"
  commit_author:
    name: GitHub Actions Bot
    email: github-actions[bot]@users.noreply.github.com
  commit_msg_template: "chore: update duckmigrate manifest to {{ .Tag }} [skip ci]"
  directory: bucket

# Homebrew tap integration
brews:
- name: duckmigrate
  description: "Database migrations for DuckDB, as a Go library and a Cobra CLI."
  homepage: "https://github.com/mrfoh/duckmigrate"
  license: "MIT"
  repository:
    owner: mrfoh
    name: homebrewtap
    branch: main
    token: "{{ .Env.GITHUB_TOKEN }}"
  commit_author:
    name: GitHub Actions Bot
    email: github-actions[bot]@users.noreply.github.com
  commit_msg_template: "chore: update duckmigrate formula to {{ .Tag }} [skip ci]"
  directory: Formula
  install: |
    bin.install "duckmigrate"
  test: |
    system "#{bin}/duckmigrate", "--version"
